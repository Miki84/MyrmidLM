# A tag vX.Y.Z (scripts/release.sh) becomes a GitHub release: the node is
# built once as a check, the Android app is built and attached (the app
# updates itself from these APKs). PCs update from the tag itself.
#
# For the APKs, set these repository secrets (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the release keystore (.jks)
#   ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release has no APK (phones keep their app).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Actions > Release > Run workflow: builds the APKs without a release (a test;
  # the APKs are under the run's artifacts)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  node-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      # The runner image has git, cmake and a compiler. No apt: when Ubuntu's
      # mirrors don't answer (it happens), apt fails the whole build.
      - name: Tools
        run: |
          cmake --version | head -1
          c++ --version | head -1
          python3 -m pip install --quiet --break-system-packages zeroconf || echo "::warning::no zeroconf (mDNS); the build doesn't need it"
      - name: Build (CPU)
        run: bash node/build.sh --backends cpu --install "$RUNNER_TEMP/myrmid"
      - name: Smoke test
        run: |
          "$RUNNER_TEMP/myrmid/bin/myrmid" --version
          "$RUNNER_TEMP/myrmid/bin/myrmid" detect

  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
        if: env.KEYSTORE != ''
        with:
          submodules: recursive  # stable-diffusion.cpp (image generation) and its ggml
      - name: No signing key
        if: env.KEYSTORE == ''
        run: echo "::notice::No ANDROID_KEYSTORE_BASE64 secret, so no APK in this release."
      - uses: actions/setup-java@v6
        if: env.KEYSTORE != ''
        with:
          distribution: temurin
          java-version: "17"
      # Pinned: the Android build (Gradle 8.14, AGP 8.11, Kotlin 2.2) is what Flutter 3.47 wants;
      # 3.50 refuses it. Move both together (android/settings.gradle.kts, gradle-wrapper.properties).
      - uses: subosito/flutter-action@v2
        if: env.KEYSTORE != ''
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Signing
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s\n' "storeFile=$RUNNER_TEMP/release.jks" \
            "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" > android/key.properties
      - name: Build APKs
        if: env.KEYSTORE != ''
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          mkdir -p out
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$f" | sed 's/^app-//; s/-release.apk$//')"
            cp "$f" "out/MyrmidLM-$(cat VERSION)-$abi.apk"
          done
      - uses: actions/upload-artifact@v7
        if: env.KEYSTORE != ''
        with:
          name: apk
          path: out/*.apk

  release:
    needs: [node-cpu, apk]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true  # no APKs without a signing key
        with:
          name: apk
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rpc="$(sed -n 's/^RPC_VERSION = "\(.*\)"/\1/p' node/myrmid.py)"
          printf '%s\n' "MyrmidLM $(cat VERSION), RPC-Protokoll $rpc." "" \
            "PCs aktualisieren sich selbst (Dashboard, Bereich Version). Neue Installation:" \
            '`curl -fsSL https://raw.githubusercontent.com/Miki84/MyrmidLM/main/install.sh | bash`' > notes.md
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --title "MyrmidLM $(cat VERSION)" --notes-file notes.md out/*.apk
