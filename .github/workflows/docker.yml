# The master's container image (Dockerfile): built for every release tag and
# pushed to ghcr.io/<owner>/myrmidlm as :<version> and :latest. The installer
# pulls it for a router-only master in Docker (and builds it locally when the
# package isn't public).
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Names
        id: n
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/myrmidlm" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.n.outputs.image }}:${{ steps.n.outputs.version }}
            ${{ steps.n.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
